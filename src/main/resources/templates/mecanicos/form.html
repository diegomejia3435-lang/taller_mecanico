
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layouts/main :: layout(~{::section})}">

<section class="container py-4">

  <!-- TITULO -->
  <div class="d-flex justify-content-between align-items-center mb-4">
    <div>
      <h2 class="fw-bold mb-1">Nuevo Mecánico</h2>
      <p class="text-muted mb-0">Registro de personal técnico para el taller</p>
    </div>
    <a th:href="@{/mecanicos}" class="btn rounded-3 px-3 py-2"
       style="background:#1a1a2e;color:#fff;font-size:0.85rem;">
      <i class="fas fa-arrow-left me-2"></i>Volver
    </a>
  </div>

  <!-- FORMULARIO -->
  <div class="card border-0 shadow-sm rounded-4">
    <div class="card-body p-4">

      <!-- HEADER DE TARJETA -->
      <div class="d-flex align-items-center gap-3 mb-4 pb-3"
           style="border-bottom:1px solid #f0f0f0;">
        <div class="rounded-3 d-flex align-items-center justify-content-center"
             style="width:42px;height:42px;background:#FAECE7;flex-shrink:0;">
          <i class="fas fa-tools" style="color:#e85d26;font-size:1.1rem;"></i>
        </div>
        <div>
          <h6 class="fw-bold mb-0">Datos del Mecánico</h6>
          <small class="text-muted">Complete todos los campos requeridos</small>
        </div>
      </div>

      <form th:action="@{/mecanicos/guardar}"
            th:object="${mecanico}"
            method="post">

        <input type="hidden" th:field="*{id}">

        <div class="row g-4">

          <!-- NOMBRE -->
          <div class="col-md-6">
            <label class="form-label fw-semibold mb-1" style="font-size:0.82rem;color:#444;">
              <i class="fas fa-user-cog me-1" style="color:#e85d26;"></i>
              Nombre del Mecánico
            </label>
            <input type="text"
                   th:field="*{nombre}"
                   class="form-control form-control-lg rounded-3 mecanico-input"
                   style="background:#f8f8f8;border:1px solid #eee;font-size:0.9rem;"
                   placeholder="Ej. Juan Pérez"
                   required>
          </div>

          <!-- ESPECIALIDAD -->
          <div class="col-md-6">
            <label class="form-label fw-semibold mb-1" style="font-size:0.82rem;color:#444;">
              <i class="fas fa-star me-1" style="color:#e85d26;"></i>
              Especialidad
            </label>
            <select th:field="*{especialidad}"
                    class="form-select form-select-lg rounded-3 mecanico-input"
                    style="background:#f8f8f8;border:1px solid #eee;font-size:0.9rem;">
              <option value="Motor">Motor</option>
              <option value="Electricidad">Electricidad</option>
              <option value="Frenos">Frenos</option>
              <option value="Suspensión">Suspensión</option>
              <option value="Transmisión">Transmisión</option>
            </select>
          </div>

          <!-- TELEFONO -->
          <div class="col-md-6">
            <label class="form-label fw-semibold mb-1" style="font-size:0.82rem;color:#444;">
              <i class="fas fa-phone me-1" style="color:#e85d26;"></i>
              Teléfono de Contacto
            </label>
            <input type="text"
                   th:field="*{telefono}"
                   class="form-control form-control-lg rounded-3 mecanico-input"
                   style="background:#f8f8f8;border:1px solid #eee;font-size:0.9rem;"
                   placeholder="999 999 999">
          </div>

          <!-- ESTADO -->
          <div class="col-md-6">
            <label class="form-label fw-semibold mb-1" style="font-size:0.82rem;color:#444;">
              <i class="fas fa-info-circle me-1" style="color:#e85d26;"></i>
              Estado Inicial
            </label>
            <select th:field="*{estado}"
                    class="form-select form-select-lg rounded-3 mecanico-input"
                    style="background:#f8f8f8;border:1px solid #eee;font-size:0.9rem;">
              <option value="Activo">Activo</option>
              <option value="En Descanso">En Descanso</option>
            </select>
          </div>

        </div>

        <!-- BOTONES -->
        <div class="mt-4 pt-3 d-flex gap-3" style="border-top:1px solid #f0f0f0;">

          <button type="submit"
                  class="btn btn-lg px-4 rounded-3"
                  style="background:#e85d26;color:#fff;font-size:0.88rem;">
            <i class="fas fa-save me-2"></i>
          </button>

          <a th:href="@{/mecanicos}"
             class="btn btn-lg px-4 rounded-3"
             style="background:#f8f8f8;color:#555;border:1px solid #eee;font-size:0.88rem;">
            Cancelar
          </a>

        </div>

      </form>
    </div>
  </div>

  <style>
    .mecanico-input { box-shadow: none !important; transition: border 0.2s, background 0.2s; }
    .mecanico-input:focus { border: 1px solid #e85d26 !important; background: #fff !important; box-shadow: 0 0 0 3px rgba(232,93,38,0.08) !important; }
  </style>

</section>
</html>
