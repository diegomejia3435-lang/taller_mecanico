<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layouts/main :: layout(~{::section})}">

<section class="container-fluid py-4">

  <!-- TITULO -->
  <div class="d-flex justify-content-between align-items-center mb-4">
    <div>
      <h2 class="fw-bold mb-1">Órdenes de Servicio</h2>
      <nav aria-label="breadcrumb">
        <ol class="breadcrumb mb-0" style="font-size:0.8rem;">
          <li class="breadcrumb-item">
            <a th:href="@{/dashboard}" class="text-decoration-none text-muted">Dashboard</a>
          </li>
          <li class="breadcrumb-item active" style="color:#e85d26;">Órdenes</li>
        </ol>
      </nav>
    </div>
    <a th:href="@{/ordenes/nuevo}"
       class="btn px-3 py-2 rounded-3 d-flex align-items-center gap-2"
       style="background:#e85d26;color:#fff;font-size:0.85rem;">
      <i class="fas fa-plus"></i>
      Nueva Orden
    </a>
  </div>

  <!-- BUSCADOR -->
  <div class="card border-0 shadow-sm rounded-4 mb-3">
    <div class="card-body py-3 px-4">
      <form class="d-flex align-items-center gap-3 flex-wrap">

        <div class="d-flex align-items-center gap-2 flex-fill"
             style="background:#f8f8f8;border:1px solid #eee;border-radius:8px;padding:8px 14px;min-width:220px;">
          <i class="fas fa-search text-muted" style="font-size:0.85rem;"></i>
          <input type="text"
                 name="buscar"
                 class="border-0 bg-transparent w-100"
                 style="outline:none;font-size:0.85rem;"
                 placeholder="Buscar por cliente, vehículo o servicio...">
        </div>

        <div class="d-flex align-items-center gap-2">
          <label class="text-muted mb-0" style="font-size:0.8rem;white-space:nowrap;">Estado:</label>
          <select class="form-select form-select-sm rounded-3"
                  style="font-size:0.82rem;border-color:#eee;background:#f8f8f8;">
            <option value="">Todos</option>
            <option value="PENDIENTE">Pendiente</option>
            <option value="EN_PROCESO">En Proceso</option>
            <option value="TERMINADO">Terminado</option>
          </select>
        </div>

        <button type="submit"
                class="btn btn-sm px-3 rounded-3 d-flex align-items-center gap-2"
                style="background:#1a1a2e;color:#fff;font-size:0.82rem;">
          <i class="fas fa-search"></i> Buscar
        </button>

        <a href="#"
           class="btn btn-sm px-3 rounded-3 d-flex align-items-center gap-2"
           style="background:#f8f8f8;color:#555;border:1px solid #eee;font-size:0.82rem;">
          <i class="fas fa-redo"></i> Limpiar
        </a>

      </form>
    </div>
  </div>

  <!-- TABLA -->
  <div class="card border-0 shadow-sm rounded-4">

    <div class="d-flex justify-content-between align-items-center px-4 py-3"
         style="border-bottom:1px solid #f0f0f0;">
      <h6 class="fw-bold mb-0">Lista de Órdenes</h6>
      <span class="text-muted" style="font-size:0.8rem;"
            th:text="${#lists.size(ordenes)} + ' órdenes registradas'">
      </span>
    </div>

    <div class="table-responsive">
      <table class="table align-middle mb-0" style="font-size:0.82rem;">
        <thead style="background:#f8f8f8;">
          <tr>
            <th class="px-4 py-3 text-muted" style="font-size:0.75rem;width:50px;">N°</th>
            <th class="py-3 text-muted" style="font-size:0.75rem;">Cliente</th>
            <th class="py-3 text-muted" style="font-size:0.75rem;">Vehículo</th>
            <th class="py-3 text-muted" style="font-size:0.75rem;">Servicios</th>
            <th class="py-3 text-muted" style="font-size:0.75rem;">Estado</th>
            <th class="py-3 text-muted" style="font-size:0.75rem;">Acciones</th>
          </tr>
        </thead>
        <tbody>

          <tr th:each="orden, stat : ${ordenes}">

            <td class="px-4 text-muted" th:text="${stat.count}">1</td>

            <td>
              <div class="d-flex align-items-center gap-2">
                <div class="rounded-circle d-flex align-items-center justify-content-center"
                     style="width:28px;height:28px;background:#FAECE7;flex-shrink:0;">
                  <i class="fas fa-user" style="color:#e85d26;font-size:0.7rem;"></i>
                </div>
                <span th:text="${orden.vehiculo.cliente.nombreCompleto}">Cliente</span>
              </div>
            </td>

            <td>
              <span class="fw-bold" style="color:#1a1a2e;"
                    th:text="${orden.vehiculo.placa}">Placa</span>
            </td>

            <td>
              <div class="d-flex flex-wrap gap-1">
                <span th:each="servicio : ${orden.servicios}"
                      class="badge px-2 py-1"
                      style="background:#f0f0f0;color:#444;font-size:0.72rem;"
                      th:text="${servicio.nombreServicio}">
                </span>
              </div>
            </td>

            <td>
              <span th:if="${orden.estado.name() == 'PENDIENTE'}"
                    class="badge px-2 py-1"
                    style="background:#FAEEDA;color:#854F0B;font-size:0.72rem;">
                Pendiente
              </span>
              <span th:if="${orden.estado.name() == 'EN_PROCESO'}"
                    class="badge px-2 py-1"
                    style="background:#E6F1FB;color:#185FA5;font-size:0.72rem;">
                En Proceso
              </span>
              <span th:if="${orden.estado.name() == 'TERMINADO'}"
                    class="badge px-2 py-1"
                    style="background:#EAF3DE;color:#3B6D11;font-size:0.72rem;">
                Terminado
              </span>
              <span th:if="${orden.estado.name() == 'CANCELADO'}"
                    class="badge px-2 py-1"
                    style="background:#FCEBEB;color:#A32D2D;font-size:0.72rem;">
                Cancelado
              </span>
            </td>

            <td>
              <div class="d-flex gap-1">
                <a th:href="@{/ordenes/editar/{id}(id=${orden.id})}"
                   class="d-flex align-items-center justify-content-center rounded-2"
                   style="width:28px;height:28px;background:#E6F1FB;color:#185FA5;"
                   title="Editar">
                  <i class="fas fa-edit" style="font-size:0.75rem;"></i>
                </a>
                <a th:href="@{/ordenes/eliminar/{id}(id=${orden.id})}"
                   class="d-flex align-items-center justify-content-center rounded-2"
                   style="width:28px;height:28px;background:#FCEBEB;color:#A32D2D;"
                   title="Eliminar"
                   onclick="return confirm('¿Está seguro de eliminar esta orden?')">
                  <i class="fas fa-trash" style="font-size:0.75rem;"></i>
                </a>
              </div>
            </td>

          </tr>

          <!-- SIN RESULTADOS -->
          <tr th:if="${#lists.isEmpty(ordenes)}">
            <td colspan="6" class="text-center py-5 text-muted">
              <i class="fas fa-clipboard-list fa-2x mb-2 d-block" style="color:#eee;"></i>
              No se encontraron órdenes
            </td>
          </tr>

        </tbody>
      </table>
    </div>

    <!-- FOOTER -->
    <div class="px-4 py-3" style="border-top:1px solid #f0f0f0;">
      <span class="text-muted" style="font-size:0.8rem;"
            th:text="'Mostrando ' + ${#lists.size(ordenes)} + ' órdenes'">
      </span>
    </div>

  </div>

  <style>
    .table tbody tr:hover { background: #fafafa; }
  </style>

</section>
</html>
