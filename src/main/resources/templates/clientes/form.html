<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layouts/main :: layout(~{::section})}">

<section class="container py-4">

  <!-- TITULO -->
  <div class="d-flex justify-content-between align-items-center mb-4">
    <div>
      <h2 class="fw-bold mb-1">Formulario Cliente</h2>
      <p class="text-muted mb-0">Registro y gestión de clientes del taller</p>
    </div>
    <a th:href="@{/clientes}" class="btn rounded-3 px-3 py-2"
       style="background:#1a1a2e;color:#fff;font-size:0.85rem;">
      <i class="fas fa-arrow-left me-2"></i>Volver
    </a>
  </div>

  <!-- FORMULARIO -->
  <div class="card border-0 shadow-sm rounded-4">
    <div class="card-body p-4">

      <!-- HEADER DE TARJETA -->
      <div class="d-flex align-items-center gap-3 mb-4 pb-3"
           style="border-bottom:1px solid #f0f0f0;">
        <div class="rounded-3 d-flex align-items-center justify-content-center"
             style="width:42px;height:42px;background:#FAECE7;flex-shrink:0;">
          <i class="fas fa-user-plus" style="color:#e85d26;font-size:1.1rem;"></i>
        </div>
        <div>
          <h6 class="fw-bold mb-0">Datos del cliente</h6>
          <small class="text-muted">Complete todos los campos requeridos</small>
        </div>
      </div>

      <form th:action="@{/clientes/guardar}"
            th:object="${cliente}"
            method="post">

        <input type="hidden" th:field="*{id}">

        <div class="row g-4">

          <!-- NOMBRE -->
          <div class="col-md-6">
            <label class="form-label fw-semibold mb-1" style="font-size:0.82rem;color:#444;">
              <i class="fas fa-user me-1" style="color:#e85d26;"></i>
              Nombre Completo
            </label>
            <input type="text"
                   th:field="*{nombreCompleto}"
                   class="form-control form-control-lg rounded-3 cliente-input"
                   style="background:#f8f8f8;border:1px solid #eee;font-size:0.9rem;"
                   placeholder="Ingrese nombre completo">
          </div>

          <!-- DNI -->
          <div class="col-md-6">
            <label class="form-label fw-semibold mb-1" style="font-size:0.82rem;color:#444;">
              <i class="fas fa-id-card me-1" style="color:#e85d26;"></i>
              DNI
            </label>
            <input type="text"
                   th:field="*{dni}"
                   class="form-control form-control-lg rounded-3 cliente-input"
                   style="background:#f8f8f8;border:1px solid #eee;font-size:0.9rem;"
                   placeholder="Ingrese DNI">
          </div>

          <!-- TELEFONO -->
          <div class="col-md-6">
            <label class="form-label fw-semibold mb-1" style="font-size:0.82rem;color:#444;">
              <i class="fas fa-phone me-1" style="color:#e85d26;"></i>
              Teléfono
            </label>
            <input type="text"
                   th:field="*{telefono}"
                   class="form-control form-control-lg rounded-3 cliente-input"
                   style="background:#f8f8f8;border:1px solid #eee;font-size:0.9rem;"
                   placeholder="Ingrese teléfono">
          </div>

          <!-- CORREO -->
          <div class="col-md-6">
            <label class="form-label fw-semibold mb-1" style="font-size:0.82rem;color:#444;">
              <i class="fas fa-envelope me-1" style="color:#e85d26;"></i>
              Correo Electrónico
            </label>
            <input type="email"
                   th:field="*{correo}"
                   class="form-control form-control-lg rounded-3 cliente-input"
                   style="background:#f8f8f8;border:1px solid #eee;font-size:0.9rem;"
                   placeholder="Ingrese correo">
          </div>

        </div>

        <!-- BOTONES -->
        <div class="mt-4 pt-3 d-flex gap-3" style="border-top:1px solid #f0f0f0;">

          <button type="submit"
                  class="btn btn-lg px-4 rounded-3"
                  style="background:#e85d26;color:#fff;font-size:0.88rem;">
            <i class="fas fa-save me-2"></i>Guardar Cliente
          </button>

          <a th:href="@{/clientes}"
             class="btn btn-lg px-4 rounded-3"
             style="background:#f8f8f8;color:#555;border:1px solid #eee;font-size:0.88rem;">
            Cancelar
          </a>

        </div>

      </form>
    </div>
  </div>

  <style>
    .cliente-input { box-shadow: none !important; transition: border 0.2s, background 0.2s; }
    .cliente-input:focus { border: 1px solid #e85d26 !important; background: #fff !important; box-shadow: 0 0 0 3px rgba(232,93,38,0.08) !important; }
  </style>

</section>
</html>
