<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layouts/main :: layout(~{::section})}">

<head>
  <title>Usuarios</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
        rel="stylesheet">
</head>

<section class="container py-4">

  <!-- TITULO -->
  <div class="d-flex justify-content-between align-items-center mb-4">
    <div>
      <h2 class="fw-bold mb-1">Usuarios</h2>
      <p class="text-muted mb-0">Administración de usuarios del sistema</p>
    </div>
    <a th:href="@{/usuarios/nuevo}"
       class="btn rounded-3 px-3 py-2"
       style="background:#e85d26;color:#fff;font-size:0.85rem;">
      <i class="fas fa-plus me-2"></i>Nuevo Usuario
    </a>
  </div>

  <!-- TABLA -->
  <div class="card shadow-sm border-0 rounded-4">
    <div class="card-body p-0">
      <table class="table table-hover align-middle mb-0">

        <thead>
          <tr style="background:#1a1a2e;">
            <th style="color:#fff;font-size:0.82rem;font-weight:500;padding:14px 18px;border:none;">ID</th>
            <th style="color:#fff;font-size:0.82rem;font-weight:500;padding:14px 18px;border:none;">Username</th>
            <th style="color:#fff;font-size:0.82rem;font-weight:500;padding:14px 18px;border:none;">Nombre</th>
            <th style="color:#fff;font-size:0.82rem;font-weight:500;padding:14px 18px;border:none;">Especialidad</th>
            <th style="color:#fff;font-size:0.82rem;font-weight:500;padding:14px 18px;border:none;">Teléfono</th>
            <th style="color:#fff;font-size:0.82rem;font-weight:500;padding:14px 18px;border:none;">Estado</th>
            <th style="color:#fff;font-size:0.82rem;font-weight:500;padding:14px 18px;border:none;">Activo</th>
            <th style="color:#fff;font-size:0.82rem;font-weight:500;padding:14px 18px;border:none;">Rol</th>
            <th style="color:#fff;font-size:0.82rem;font-weight:500;padding:14px 18px;border:none;">Acciones</th>
          </tr>
        </thead>

        <tbody>
          <tr th:each="usuario : ${usuarios}">

            <td style="font-size:0.88rem;padding:13px 18px;" th:text="${usuario.id}"></td>

            <td style="font-size:0.88rem;padding:13px 18px;" th:text="${usuario.username}"></td>

            <td style="font-size:0.88rem;padding:13px 18px;" th:text="${usuario.nombreCompleto}"></td>

            <td style="font-size:0.88rem;padding:13px 18px;" th:text="${usuario.especialidad}"></td>

            <td style="font-size:0.88rem;padding:13px 18px;" th:text="${usuario.telefono}"></td>

            <td style="font-size:0.88rem;padding:13px 18px;" th:text="${usuario.estado}"></td>

            <td style="padding:13px 18px;">
              <span class="badge rounded-pill px-3 py-2"
                    style="background:#E1F5EE;color:#085041;font-size:0.78rem;font-weight:500;"
                    th:text="${usuario.enabled}">
              </span>
            </td>

            <td style="padding:13px 18px;">
              <span th:if="${usuario.rol != null}"
                    class="badge rounded-pill px-3 py-2"
                    style="background:#EEEDFE;color:#3C3489;font-size:0.78rem;font-weight:500;"
                    th:text="${usuario.rol.nombre}">
              </span>
            </td>

            <td style="padding:13px 18px;">
              <div class="d-flex gap-2">
                <a th:href="@{/usuarios/editar/{id}(id=${usuario.id})}"
                   class="btn btn-sm rounded-3"
                   style="background:#FAEEDA;color:#633806;border:none;font-size:0.78rem;">
                  <i class="fas fa-edit me-1"></i>Editar
                </a>
                <a th:href="@{/usuarios/eliminar/{id}(id=${usuario.id})}"
                   class="btn btn-sm rounded-3"
                   style="background:#FAECE7;color:#e85d26;border:none;font-size:0.78rem;">
                  <i class="fas fa-trash me-1"></i>Eliminar
                </a>
              </div>
            </td>

          </tr>
        </tbody>

      </table>
    </div>
  </div>

  <style>
    .table tbody tr:hover { background: #fafafa; }
  </style>

</section>
</html>
