<!DOCTYPE html>
<html xmlns:th="http://thymeleaf.org"
      th:replace="~{layouts/main :: layout(~{::section})}">

<section class="container-fluid py-4">

  <!-- TITULO -->
  <div class="d-flex justify-content-between align-items-center mb-4">
    <div>
      <h2 class="fw-bold mb-1">Gestión de Vehículos</h2>
      <nav aria-label="breadcrumb">
        <ol class="breadcrumb mb-0" style="font-size:0.8rem;">
          <li class="breadcrumb-item">
            <a th:href="@{/dashboard}" class="text-decoration-none text-muted">Dashboard</a>
          </li>
          <li class="breadcrumb-item active" style="color:#e85d26;">Vehículos</li>
        </ol>
      </nav>
    </div>
    <a th:href="@{/vehiculos/nuevo}"
       class="btn px-3 py-2 rounded-3 d-flex align-items-center gap-2"
       style="background:#e85d26;color:#fff;font-size:0.85rem;">
      <i class="fas fa-plus"></i>
      Nuevo Vehículo
    </a>
  </div>

  <!-- BUSCADOR -->
  <div class="card border-0 shadow-sm rounded-4 mb-3">
    <div class="card-body py-3 px-4">
      <form th:action="@{/vehiculos}" method="get" class="d-flex align-items-center gap-3 flex-wrap">
        <div class="d-flex align-items-center gap-2 flex-fill"
             style="background:#f8f8f8;border:1px solid #eee;border-radius:8px;padding:8px 14px;min-width:220px;">
          <i class="fas fa-search text-muted" style="font-size:0.85rem;"></i>
          <input type="text" name="buscar" class="border-0 bg-transparent w-100"
                 style="outline:none;font-size:0.85rem;"
                 placeholder="Buscar por placa, marca o cliente...">
        </div>
        <button type="submit" class="btn btn-sm px-3 rounded-3" style="background:#1a1a2e;color:#fff;">
          <i class="fas fa-search"></i> Buscar
        </button>
      </form>
    </div>
  </div>

  <!-- TABLA -->
  <div class="card border-0 shadow-sm rounded-4">
    <div class="table-responsive">
      <table class="table align-middle mb-0" style="font-size:0.82rem;">
        <thead style="background:#f8f8f8;">
          <tr>
            <th class="px-4 py-3 text-muted">N°</th>
            <th>Placa</th>
            <th>Marca</th>
            <th>Modelo</th>
            <th>Año</th>
            <th>Propietario</th>
            <th>Acciones</th>
          </tr>
        </thead>
        <tbody>
          <!-- EL BUCLE: Se agregaron '?' para evitar el Error 500 si hay nulos -->
          <tr th:each="vehiculo, stat : ${vehiculos}">
            <td class="px-4" th:text="${stat.count}">1</td>
            <td><span class="fw-bold" th:text="${vehiculo.placa}">ABC-123</span></td>
            <td th:text="${vehiculo.marca}">Marca</td>
            <td th:text="${vehiculo.modelo}">Modelo</td>
            <td th:text="${vehiculo.anio}">2020</td>
            <!-- El '?' es vital aquí por si el vehículo no tiene cliente -->
            <td th:text="${vehiculo.cliente?.nombreCompleto ?: 'Sin asignar'}">Propietario</td>
            <td>
              <div class="d-flex gap-1">
                <a th:href="@{/vehiculos/editar/{id}(id=${vehiculo.id})}" class="btn btn-sm btn-light">
                  <i class="fas fa-edit"></i>
                </a>
                <a th:href="@{/vehiculos/eliminar/{id}(id=${vehiculo.id})}" class="btn btn-sm btn-danger"
                   onclick="return confirm('¿Eliminar?')">
                  <i class="fas fa-trash"></i>
                </a>
              </div>
            </td>
          </tr>
          <!-- SI LA LISTA ESTÁ VACÍA -->
          <tr th:if="${#lists.isEmpty(vehiculos)}">
            <td colspan="7" class="text-center py-5">No hay vehículos registrados</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</section>
</html>
