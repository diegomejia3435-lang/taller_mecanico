<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layouts/main :: layout(~{::section})}">

<head>

    <meta charset="UTF-8">

    <title>Orden</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

</head>

<section>

<div class="container mt-4">

    <div class="card">

        <div class="card-header">

            <h3>Orden de Mantenimiento</h3>

        </div>

        <div class="card-body">

            <form th:action="@{/ordenes/guardar}"
                  th:object="${orden}"
                  method="post">

                <input type="hidden"
                       th:field="*{id}">

                <div class="mb-3">

                    <label>Vehículo</label>

                    <select th:field="*{vehiculo}"
                            class="form-select"
                            th:disabled="${#authorization.expression('hasRole(''MECANICO'')')}">

                        <option value="">
                            Seleccione
                        </option>

                        <option
                                th:each="vehiculo : ${vehiculos}"
                                th:value="${vehiculo.id}"
                                th:text="${vehiculo.placa + ' - ' + vehiculo.marca}">
                        </option>

                    </select>

                </div>

                <div class="mb-3">

                    <label>Mecánico</label>

                    <select th:field="*{mecanico}"
                            class="form-select"
                            th:disabled="${#authorization.expression('hasRole(''MECANICO'')')}">

                        <option value="">
                            Seleccione
                        </option>

                        <option
                                th:each="mecanico : ${mecanicos}"
                                th:value="${mecanico.id}"
                                th:text="${mecanico.nombreCompleto}">
                        </option>

                    </select>

                </div>

                <div class="mb-3">

                    <label>Estado</label>

                    <select th:field="*{estado}"
                            class="form-select">

                        <option
                                th:each="estado : ${estados}"
                                th:value="${estado}"
                                th:text="${estado}">
                        </option>

                    </select>

                </div>

                <div class="mb-3">

                    <label>Diagnóstico Técnico</label>

                    <textarea th:field="*{diagnosticoTecnico}"
                              class="form-control"
                              rows="4"></textarea>

                </div>

                <div class="mb-3">

                    <label>Servicios</label>

                    <select th:field="*{servicios}"
                            class="form-select"
                            multiple
                            th:disabled="${#authorization.expression('hasRole(''MECANICO'')')}">

                        <option
                                th:each="servicio : ${servicios}"
                                th:value="${servicio.id}"
                                th:text="${servicio.nombreServicio}">
                        </option>

                    </select>

                </div>

                <button class="btn btn-success">

                    Guardar

                </button>

                <a th:href="@{/ordenes}"
                   class="btn btn-secondary">

                    Volver

                </a>

            </form>

        </div>

    </div>

</div>

</section>
</html>
