<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:replace="~{layouts/main :: layout(~{::section})}">

<section class="container-fluid py-4">

  <!-- TITULO -->
  <div class="d-flex justify-content-between align-items-center mb-4">
    <div>
      <h2 class="fw-bold mb-1">Gestión de Clientes</h2>
      <nav aria-label="breadcrumb">
        <ol class="breadcrumb mb-0" style="font-size:0.8rem;">
          <li class="breadcrumb-item">
            <a th:href="@{/dashboard}" class="text-decoration-none text-muted">Dashboard</a>
          </li>
          <li class="breadcrumb-item active" style="color:#e85d26;">Clientes</li>
        </ol>
      </nav>
    </div>
    <a th:href="@{/clientes/nuevo}"
       class="btn px-3 py-2 rounded-3 d-flex align-items-center gap-2"
       style="background:#e85d26;color:#fff;font-size:0.85rem;">
      <i class="fas fa-plus"></i>
      Nuevo Cliente
    </a>
  </div>

  <!-- TABLA -->
  <div class="card border-0 shadow-sm rounded-4">

    <div class="d-flex justify-content-between align-items-center px-4 py-3"
         style="border-bottom:1px solid #f0f0f0;">
      <h6 class="fw-bold mb-0">Lista de Clientes</h6>
      <span class="text-muted" style="font-size:0.8rem;"
            th:text="${#lists.size(clientes)} + ' clientes registrados'">
      </span>
    </div>

    <div class="table-responsive">
      <table class="table align-middle mb-0" style="font-size:0.82rem;">
        <thead style="background:#f8f8f8;">
          <tr>
            <th class="px-4 py-3 text-muted" style="font-size:0.75rem;width:40px;">N°</th>
            <th class="py-3 text-muted" style="font-size:0.75rem;">Nombre</th>
            <th class="py-3 text-muted" style="font-size:0.75rem;">DNI</th>
            <th class="py-3 text-muted" style="font-size:0.75rem;">Teléfono</th>
            <th class="py-3 text-muted" style="font-size:0.75rem;">Email</th>
            <th class="py-3 text-muted" style="font-size:0.75rem;">Acciones</th>
          </tr>
        </thead>
        <tbody>

          <tr th:each="cliente, stat : ${clientes}">
            <td class="px-4 text-muted" th:text="${stat.count}">1</td>
            <td th:text="${cliente.nombreCompleto}">Nombre</td>
            <td th:text="${cliente.dni}">DNI</td>
            <td th:text="${cliente.telefono}">Teléfono</td>
            <td th:text="${cliente.correo}">Email</td>
            <td>
              <div class="d-flex gap-1">
                <a th:href="@{/clientes/editar/{id}(id=${cliente.id})}"
                   class="d-flex align-items-center justify-content-center rounded-2"
                   style="width:28px;height:28px;background:#E6F1FB;color:#185FA5;"
                   title="Editar">
                  <i class="fas fa-edit" style="font-size:0.75rem;"></i>
                </a>
                <a th:href="@{/clientes/eliminar/{id}(id=${cliente.id})}"
                   class="d-flex align-items-center justify-content-center rounded-2"
                   style="width:28px;height:28px;background:#FCEBEB;color:#A32D2D;"
                   title="Eliminar"
                   onclick="return confirm('¿Está seguro de eliminar este cliente?')">
                  <i class="fas fa-trash" style="font-size:0.75rem;"></i>
                </a>
              </div>
            </td>
          </tr>

          <!-- SIN RESULTADOS -->
          <tr th:if="${#lists.isEmpty(clientes)}">
            <td colspan="6" class="text-center py-5 text-muted">
              <i class="fas fa-users fa-2x mb-2 d-block" style="color:#eee;"></i>
              No se encontraron clientes
            </td>
          </tr>

        </tbody>
      </table>
    </div>

  </div>

  <style>
    .table tbody tr:hover { background: #fafafa; }
  </style>

</section>
</html>
