<header class="encabezado">
  <div class="encabezado__contenedor">
    <!-- Marca del Taller Automotriz -->
    <a routerLink="/inicio" class="encabezado__marca">
      <div class="encabezado__icono">🚗</div>
      <div>
        <h1 class="encabezado__titulo">Taller Mecánico</h1>
        <p class="encabezado__subtitulo">Sistema de Servicios & Mantenimiento</p>
      </div>
    </a>

    <!-- Barra de Navegación SPA con routerLink (Semana 12 - Slide 12) -->
    <nav class="encabezado__nav">
      <a
        routerLink="/inicio"
        routerLinkActive="activo"
        [routerLinkActiveOptions]="{ exact: true }"
        class="encabezado__enlace"
      >
        <span class="encabezado__enlace-icono">🏠</span>
        <span>Inicio</span>
      </a>

      <a
        routerLink="/servicios"
        routerLinkActive="activo"
        class="encabezado__enlace"
      >
        <span class="encabezado__enlace-icono">🔧</span>
        <span>Servicios</span>
      </a>

      <!-- Acceso a Favoritos con Contador Reactivo (Semana 12 - Slide 24 y 25) -->
      <a
        routerLink="/favoritos"
        routerLinkActive="activo"
        class="encabezado__enlace encabezado__enlace--favoritos"
      >
        <span class="encabezado__enlace-icono">⭐</span>
        <span>Favoritos</span>
        <span class="encabezado__badge">{{ favoritosService.cantidad() }}</span>
      </a>
    </nav>
  </div>
</header>
