<article class="tarjeta" [class.tarjeta--agotado]="!servicio().disponible">
  <div class="tarjeta__cabecera">
    <span class="tarjeta__icono">{{ servicio().icono }}</span>
    <div class="tarjeta__meta">
      <span class="tarjeta__categoria">{{ servicio().categoria }}</span>
      <button
        type="button"
        class="tarjeta__btn-favorito"
        [class.activo]="esFavorito()"
        (click)="onAlternarFavorito()"
        [title]="esFavorito() ? 'Quitar de favoritos' : 'Guardar en favoritos'"
      >
        {{ esFavorito() ? '★' : '☆' }}
      </button>
    </div>
  </div>

  <div class="tarjeta__cuerpo">
    <h3 class="tarjeta__titulo">{{ servicio().nombre }}</h3>
    <p class="tarjeta__descripcion">{{ servicio().descripcion }}</p>
    <div class="tarjeta__detalles-rapidos">
      <span class="tarjeta__tiempo">⏱ {{ servicio().tiempoEstimado }}</span>
      <span class="tarjeta__garantia">🛡 {{ servicio().garantia }}</span>
    </div>
  </div>

  <div class="tarjeta__pie">
    <div class="tarjeta__precio-bloque">
      <span class="tarjeta__precio-etiqueta">Precio Base</span>
      <span class="tarjeta__precio">S/ {{ servicio().precioBase.toFixed(2) }}</span>
    </div>

    <div class="tarjeta__acciones">
      <button
        type="button"
        class="tarjeta__boton tarjeta__boton--detalle"
        (click)="onVerDetalle()"
      >
        Ver Detalle
      </button>
    </div>
  </div>
</article>
